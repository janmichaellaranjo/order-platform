syntax = "proto3";

package fulfillment;

option java_multiple_files = true;
option java_package = "com.democompany.orderplatform.common.grpc.fulfillment";

service FulfillmentService {
  rpc ScheduleFulfillment (ScheduleFulfillmentRequest) returns (ScheduleFulfillmentResponse);
}

message ScheduleFulfillmentRequest {
  string order_id = 1;
  repeated FulfillmentItem items = 2;
  string shipping_address = 3;
}

message FulfillmentItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ScheduleFulfillmentResponse {
  string tracking_reference = 2;
}